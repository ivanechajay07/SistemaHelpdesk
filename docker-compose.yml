services:
  mysql:
    image: mysql:8.0
    container_name: helpdesk_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-helpdesk_db}
      MYSQL_USER: ${DB_USERNAME:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  mailpit:
    image: axllent/mailpit
    container_name: helpdesk_mailpit
    ports:
      - "8025:8025" # Interfaz Web
      - "1025:1025" # Servidor SMTP
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: helpdesk_backend
    ports:
      - "${BACKEND_PORT:-8082}:8080"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-helpdesk_db}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - SERVER_PORT=8080
      - APP_TZ=${APP_TZ:-America/Lima}
      - TZ=${APP_TZ:-America/Lima}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET es obligatorio (definelo en .env)}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      - SWAGGER_ENABLED=${SWAGGER_ENABLED:-true}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: helpdesk_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: "1"
      UPLOAD_LIMIT: "200M"
    ports:
      - "${PMA_PORT:-8083}:80"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api/v1
        - VITE_PUBLIC_APP_URL=${VITE_PUBLIC_APP_URL:-}
    container_name: helpdesk_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
  uploads_data:
