services:
  mysql:
    image: mysql:8.0
    container_name: helpdesk_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD es obligatorio (definelo en .env)}
      MYSQL_DATABASE: ${DB_NAME:-helpdesk_db}
      # Usuario de aplicación con permisos solo sobre esta base (nunca root).
      MYSQL_USER: ${DB_APP_USER:-helpdesk}
      MYSQL_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD es obligatorio (definelo en .env)}
    # Solo accesible desde el propio host: nunca exponer MySQL a la red.
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: helpdesk_backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8082}:8080"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-helpdesk_db}
      - DB_USERNAME=${DB_APP_USER:-helpdesk}
      - DB_PASSWORD=${DB_APP_PASSWORD:-helpdesk_dev}
      - DB_POOL_MAX=${DB_POOL_MAX:-20}
      - DB_POOL_MIN=${DB_POOL_MIN:-5}
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - SERVER_PORT=8080
      - APP_TZ=${APP_TZ:-America/Lima}
      - TZ=${APP_TZ:-America/Lima}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET es obligatorio (definelo en .env)}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-1800000}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      - SWAGGER_ENABLED=${SWAGGER_ENABLED:-false}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD es obligatorio (definelo en .env)}
      - ALLOW_DEFAULT_ADMIN_PASSWORD=${ALLOW_DEFAULT_ADMIN_PASSWORD:-false}
      - MAX_LOGIN_ATTEMPTS=${MAX_LOGIN_ATTEMPTS:-5}
      - LOCK_MINUTES=${LOCK_MINUTES:-15}
      - LOGIN_IP_ATTEMPTS=${LOGIN_IP_ATTEMPTS:-120}
      - LOGIN_IP_WINDOW_SECONDS=${LOGIN_IP_WINDOW_SECONDS:-60}
      - IDLE_TIMEOUT_MINUTES=${IDLE_TIMEOUT_MINUTES:-15}
      - CLAMAV_HOST=${CLAMAV_HOST:-}
      - CLAMAV_PORT=${CLAMAV_PORT:-3310}
      - CLAMAV_FAIL_CLOSED=${CLAMAV_FAIL_CLOSED:-false}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api/v1
        - VITE_PUBLIC_APP_URL=${VITE_PUBLIC_APP_URL:-}
        - VITE_IDLE_TIMEOUT_MINUTES=${VITE_IDLE_TIMEOUT_MINUTES:-15}
    container_name: helpdesk_frontend
    # Nginx sin privilegios escucha en 8080 (no requiere root).
    # FRONTEND_BIND=0.0.0.0 permite acceso desde la LAN; usa 127.0.0.1 si
    # publicas la app únicamente detrás de un proxy/TLS.
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-5173}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
  uploads_data:
