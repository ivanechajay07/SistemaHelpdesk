server {
    # Nginx sin privilegios: escucha en 8080.
    listen 8080;
    server_name _;

    # No revelar la versión del servidor.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de seguridad (se incluyen también en cada location que declare add_header).
    include /etc/nginx/security-headers.conf;

    # Tamaños de subida de archivos (archivos adjuntos de tickets)
    client_max_body_size 20m;

    # API -> backend (evita problemas de CORS al estar todo bajo el mismo origen)
    location /api/ {
        proxy_pass http://backend:8080/api/;
        # Incluye el puerto real para que Spring detecte same-origin y no
        # rechace por CORS cuando se accede desde la IP de la LAN.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # Respuestas de API con datos personales: no cachear en el navegador.
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # WebSocket (chat en tiempo real)
    location /ws/ {
        proxy_pass http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA: cualquier otra ruta sirve el index.html
    location / {
        try_files $uri $uri/ /index.html;
        # El index.html nunca debe cachearse: el navegador debe revalidar para
        # recibir la última build (nuevos módulos/menús) sin caché antigua.
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
        include /etc/nginx/security-headers.conf;
    }

    # Cache de assets versionados por Vite
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }
}
