server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Tamaños de subida de archivos (archivos adjuntos de tickets)
    client_max_body_size 20m;

    # API -> backend (evita problemas de CORS al estar todo bajo el mismo origen)
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (chat en tiempo real)
    location /ws/ {
        proxy_pass http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA: cualquier otra ruta sirve el index.html
    location / {
        try_files $uri $uri/ /index.html;
        # El index.html nunca debe cachearse: el navegador debe revalidar para
        # recibir la última build (nuevos módulos/menús) sin caché antigua.
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Cache de assets versionados por Vite
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
