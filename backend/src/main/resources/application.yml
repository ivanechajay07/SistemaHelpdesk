spring:
  application:
    name: helpdesk

  main:
    # Arranque más rápido: oculta el banner de Spring Boot.
    banner-mode: off

  jackson:
    time-zone: ${APP_TZ:America/Lima}

  # Límite global de paginación: evita que el cliente pida páginas gigantes (DoS)
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  # Carga el archivo .env de la raiz del proyecto (o de backend/) si existe
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]

  # Límites de subida (el endpoint de chat permite hasta 10 MB).
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:helpdesk_db}?useSSL=false&connectionTimeZone=LOCAL&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Varios usuarios concurrentes: pool dimensionado y timeouts explícitos.
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      # El esquema lo gestiona Flyway; Hibernate solo valida que coincida.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:false}

  # Migraciones versionadas. En una BD ya existente (sin historial Flyway) se
  # marca el baseline en la versión 1 y no se re-ejecuta V1__baseline.sql.
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: baseline-esquema-inicial
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8081}
  # Detrás de Nginx/Cloudflare: respeta X-Forwarded-Proto/Host para que
  # Spring detecte correctamente same-origin y HTTPS.
  forward-headers-strategy: framework
  error:
    include-message: never
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    swagger-enabled: ${SWAGGER_ENABLED:false}
    # true en producción (HTTPS): la cookie de refresh solo viaja por TLS.
    cookie-secure: ${COOKIE_SECURE:false}
    # Bloqueo temporal tras intentos fallidos
    max-login-attempts: ${MAX_LOGIN_ATTEMPTS:5}
    lock-minutes: ${LOCK_MINUTES:15}
    # Límite por IP para oficinas detrás de NAT. El límite por usuario sigue en 5/min.
    login-ip-attempts: ${LOGIN_IP_ATTEMPTS:120}
    login-ip-window-seconds: ${LOGIN_IP_WINDOW_SECONDS:60}
    # Los ADMIN deben configurar Google Authenticator en el primer login.
    # Para recuperar acceso si se pierde el dispositivo, poner false temporalmente.
    require-2fa-for-admins: ${REQUIRE_2FA_FOR_ADMINS:true}
    # Recuperación: true desactiva 2FA del admin al arrancar (usar solo una vez).
    reset-admin-2fa: ${RESET_ADMIN_2FA:false}
    # Cierre de sesión por inactividad (0 = deshabilitado)
    idle-timeout-minutes: ${IDLE_TIMEOUT_MINUTES:15}
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400000}
  upload:
    # Escaneo antivirus opcional con ClamAV (clamd INSTREAM).
    clamav-host: ${CLAMAV_HOST:}
    clamav-port: ${CLAMAV_PORT:3310}
    clamav-timeout-ms: ${CLAMAV_TIMEOUT_MS:5000}
    # true = rechazar archivos si ClamAV no responde (recomendado en producción).
    clamav-fail-closed: ${CLAMAV_FAIL_CLOSED:false}
  crypto:
    secret: ${CRYPTO_SECRET:${JWT_SECRET}}
  file:
    upload-dir: ${UPLOAD_DIR:./uploads}
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}

  # Monitoreo de red: permite apuntar a equipos internos (192.168.x, 10.x, localhost).
  # Requiere permiso MONITORING_VIEW/ADMIN. Pon false para restringir a IPs públicas.
  monitoring:
    allow-private-targets: ${MONITORING_ALLOW_PRIVATE:true}

# Swagger/OpenAPI: deshabilitable en producción con SWAGGER_ENABLED=false
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

# Logging configuration
# show-sql y el bind de parámetros (que incluye datos sensibles) quedan
# desactivados por defecto; actívalos solo en desarrollo con JPA_SHOW_SQL=true.
logging:
  level:
    root: INFO
    com.empresa.helpdesk: ${APP_LOG_LEVEL:INFO}
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
    org.hibernate.type.descriptor.sql.BasicBinder: ${SQL_BINDER_LOG_LEVEL:WARN}
