name: APK Android

# Distribución libre (sin Play Store): compila el APK y lo deja como artefacto.
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'versionCode (entero, debe subir en cada APK)'
        required: true
        default: '1'
      version_name:
        description: 'versionName visible (ej: 1.2.0)'
        required: true
        default: '1.0.0'
      api_url:
        description: 'URL del backend para la APK (ej: http://192.168.18.140:8089/api/v1)'
        required: false
        default: ''
  push:
    tags:
      - 'apk-v*'
  pull_request:
    paths:
      - 'frontend/android/**'
      - 'frontend/capacitor.config.ts'
      - '.github/workflows/android-apk.yml'

jobs:
  apk:
    name: Compilar APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar SDK de Android
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar frontend y sincronizar Capacitor
        env:
          VITE_API_URL: ${{ inputs.api_url || vars.VITE_API_URL }}
        run: |
          npm run build
          npx cap sync android

      - name: Comprobar si hay keystore de firma
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No existe ANDROID_KEYSTORE_BASE64: se generará un APK de depuración."
          fi

      - name: Configurar firma de release
        if: steps.keystore.outputs.present == 'true'
        working-directory: frontend/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Compilar APK de release
        if: steps.keystore.outputs.present == 'true'
        working-directory: frontend/android
        env:
          APP_VERSION_CODE: ${{ inputs.version_code || '1' }}
          APP_VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Compilar APK de depuración
        if: steps.keystore.outputs.present != 'true'
        working-directory: frontend/android
        env:
          APP_VERSION_CODE: ${{ inputs.version_code || '1' }}
          APP_VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v6
        with:
          name: helpdesk-apk
          path: |
            frontend/android/app/build/outputs/apk/release/*.apk
            frontend/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
